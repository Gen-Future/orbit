name: orbit-dev
services:
  postgres:
    image: postgres:17-alpine
    ports: ['127.0.0.1:55432:5432']
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    volumes: [devpg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orbit]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56379:6379']
    command: redis-server --appendonly yes
    volumes: [devredis:/data]
volumes:
  devpg:
  devredis:
