name: orbit
x-app: &app
  build: .
  image: orbit:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql://orbit:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/orbit
    REDIS_URL: redis://redis:6379
    APP_URL: https://${ORBIT_DOMAIN:?Set ORBIT_DOMAIN}
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orbit -d orbit]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *app
    restart: 'no'
    command: npm run db:migrate
    depends_on:
      postgres: {condition: service_healthy}
  web:
    <<: *app
    command: npm start
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: npm run worker
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "const R=require('ioredis');const r=new R(process.env.REDIS_URL);r.get('orbit:worker:heartbeat').then(v=>{r.disconnect();process.exit(v?0:1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
  caddy:
    image: caddy:2-alpine
    environment:
      ORBIT_DOMAIN: ${ORBIT_DOMAIN:?Set ORBIT_DOMAIN}
    ports: ['80:80', '443:443']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddydata:/data', 'caddyconfig:/config']
    depends_on: [web]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
